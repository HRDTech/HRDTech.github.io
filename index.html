<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HRDTech – Portafolio de aplicaciones y proyectos de software." />
  <meta name="theme-color" content="#0d1117" />
  <title>HRDTech · Apps</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <style>
    /* ─── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg:        #0a0c10;
      --surface:   #111318;
      --border:    #1e222b;
      --accent:    #00e5a0;
      --accent2:   #0af;
      --text:      #e6eaf3;
      --muted:     #6b7280;
      --danger:    #ff5f57;
      --warn:      #ffbc2e;
      --ok:        #28c840;
      --radius:    14px;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Instrument Sans', sans-serif;
      --display:   'Syne', sans-serif;
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ─── NOISE OVERLAY ──────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* ─── GLOW ORBS ──────────────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .12;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 600px; height: 600px; background: var(--accent);  top: -200px; left: -200px; }
    .orb-2 { width: 500px; height: 500px; background: var(--accent2); bottom: -150px; right: -150px; }

    /* ─── LAYOUT ─────────────────────────────────────────────── */
    .wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ─── HEADER ─────────────────────────────────────────────── */
    header {
      padding: 64px 0 48px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .logo-badge {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px 6px 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .04em;
    }
    .logo-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .5; transform: scale(.8); }
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -.03em;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      max-width: 480px;
    }

    /* ─── STATS BAR ──────────────────────────────────────────── */
    .stats-bar {
      display: flex; flex-wrap: wrap; gap: 20px;
      margin-top: 8px;
    }
    .stat {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }
    .stat strong { color: var(--text); font-size: 18px; font-family: var(--display); font-weight: 700; }

    /* ─── CONTROLS ───────────────────────────────────────────── */
    .controls {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .search-wrap {
      position: relative; flex: 1; min-width: 220px;
    }
    .search-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      opacity: .4; pointer-events: none;
    }
    input[type=search] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      padding: 10px 14px 10px 40px;
      outline: none;
      transition: border-color .2s;
    }
    input[type=search]:focus { border-color: var(--accent); }
    input[type=search]::placeholder { color: var(--muted); }

    .filter-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 14px;
      letter-spacing: .05em;
      transition: all .2s;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 14px;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: var(--accent); }

    /* ─── GRID ───────────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      margin-bottom: 64px;
    }

    /* ─── CARD ───────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color .25s, transform .25s, box-shadow .25s;
      animation: fadeUp .4s ease both;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,229,160,.1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      padding: 20px 20px 14px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .card-title {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.3;
    }
    .card-title a:hover { color: var(--accent); }

    .lang-badge {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 10px;
      padding: 4px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .lang-dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ─── README AREA ────────────────────────────────────────── */
    .readme-area {
      padding: 0 20px 16px;
      flex: 1;
    }
    .readme-collapsed {
      max-height: 120px;
      overflow: hidden;
      position: relative;
    }
    .readme-collapsed::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(transparent, var(--surface));
    }
    .readme-content {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.7;
    }
    .readme-content h1, .readme-content h2, .readme-content h3 {
      font-family: var(--display);
      font-size: 14px;
      color: var(--text);
      margin: 10px 0 6px;
    }
    .readme-content p { margin-bottom: 8px; }
    .readme-content ul, .readme-content ol { padding-left: 18px; margin-bottom: 8px; }
    .readme-content li { margin-bottom: 3px; }
    .readme-content code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      padding: 1px 5px;
    }
    .readme-content pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      padding: 12px;
      margin-bottom: 8px;
    }
    .readme-content pre code { border: none; background: transparent; padding: 0; }
    .readme-content img { max-height: 100px; border-radius: 6px; }
    .readme-content a { color: var(--accent2); text-decoration: underline; }
    .readme-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .read-more-btn {
      background: none; border: none; cursor: pointer;
      color: var(--accent); font-family: var(--mono); font-size: 11px;
      padding: 4px 0; display: block; margin-top: 6px;
    }
    .read-more-btn:hover { text-decoration: underline; }

    .no-readme {
      font-family: var(--mono); font-size: 12px;
      color: var(--muted); font-style: italic;
    }

    /* ─── RELEASE SECTION ────────────────────────────────────── */
    .releases-section {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
    }
    .releases-title {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .release-item {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .release-tag {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 12px;
    }
    .release-tag svg { opacity: .5; }
    .release-name {
      font-size: 12px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 140px;
    }
    .release-assets {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .dl-btn {
      display: flex; align-items: center; gap: 5px;
      background: linear-gradient(135deg, var(--accent) 0%, #00b87a 100%);
      border-radius: 6px;
      color: #000;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .04em;
      padding: 5px 10px;
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
    }
    .dl-btn:hover { opacity: .85; transform: scale(1.03); }
    .dl-btn.source {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .dl-btn.source:hover { border-color: var(--accent); color: var(--accent); }
    .no-release {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }

    /* ─── CARD FOOTER ────────────────────────────────────────── */
    .card-footer {
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .meta-pills { display: flex; gap: 12px; }
    .meta-pill {
      display: flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    .gh-link {
      display: flex; align-items: center; gap: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      padding: 4px 10px;
      transition: all .2s;
    }
    .gh-link:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── SKELETON ───────────────────────────────────────────── */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 300px;
      overflow: hidden;
      position: relative;
    }
    .skeleton-card::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.04) 50%, transparent 100%);
      animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    /* ─── EMPTY STATE ────────────────────────────────────────── */
    #empty {
      display: none;
      text-align: center;
      padding: 80px 20px;
      grid-column: 1/-1;
    }
    #empty svg { opacity: .2; margin: 0 auto 16px; }
    #empty p { color: var(--muted); font-family: var(--mono); font-size: 13px; }

    /* ─── ERROR STATE ────────────────────────────────────────── */
    #error-banner {
      display: none;
      background: rgba(255,95,87,.1);
      border: 1px solid rgba(255,95,87,.3);
      border-radius: var(--radius);
      color: var(--danger);
      font-family: var(--mono);
      font-size: 13px;
      margin-bottom: 32px;
      padding: 16px 20px;
    }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    footer a:hover { color: var(--accent); }

    /* ─── MODAL ──────────────────────────────────────────────── */
    #modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      padding: 32px 16px;
      overflow-y: auto;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 720px;
      width: 100%;
      margin: auto;
      padding: 32px;
      position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); cursor: pointer;
      font-size: 18px; line-height: 1;
      padding: 6px 10px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-title {
      font-family: var(--display); font-size: 1.5rem;
      font-weight: 800; margin-bottom: 20px;
      padding-right: 40px;
    }
    .modal-readme { font-size: 14px; }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      #grid { grid-template-columns: 1fr; }
      header { padding: 40px 0 28px; }
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="logo-badge">
      <span class="logo-dot"></span>
      github.com/HRDTech
    </div>
    <h1>HRD<span>Tech</span><br>Apps & Projects</h1>
    <p class="subtitle">Explora y descarga todas las aplicaciones y proyectos desarrollados por HRDTech.</p>
    <div class="stats-bar" id="stats-bar">
      <div class="stat"><strong id="stat-repos">—</strong> repositorios</div>
      <div class="stat"><strong id="stat-releases">—</strong> releases</div>
      <div class="stat"><strong id="stat-langs">—</strong> lenguajes</div>
    </div>
  </header>

  <!-- ERROR -->
  <div id="error-banner"></div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="search" id="search" placeholder="Buscar repositorios…" aria-label="Buscar" />
    </div>
    <div class="filter-btns" id="filter-btns">
      <button class="filter-btn active" data-lang="all">Todos</button>
    </div>
    <select class="sort-select" id="sort-select" aria-label="Ordenar">
      <option value="updated">Más recientes</option>
      <option value="stars">Más estrellas</option>
      <option value="name">Nombre A–Z</option>
      <option value="forks">Más forks</option>
    </select>
  </div>

  <!-- GRID -->
  <div id="grid" role="list" aria-label="Repositorios" aria-live="polite"></div>

  <!-- FOOTER -->
  <footer>
    <span>HRDTech · Portafolio generado dinámicamente via GitHub API</span>
    <a href="https://github.com/HRDTech" target="_blank" rel="noopener">
      Ver organización en GitHub ↗
    </a>
  </footer>
</div>

<!-- README MODAL -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-readme readme-content" id="modal-readme"></div>
  </div>
</div>

<script>
/* ─── CONFIG ─────────────────────────────────────────────────── */
const ORG      = 'HRDTech';
const API      = 'https://api.github.com';
const HEADERS  = { Accept: 'application/vnd.github+json' };
const PER_PAGE = 100;

/* ─── STATE ──────────────────────────────────────────────────── */
let allRepos   = [];
let langFilter = 'all';
let sortMode   = 'updated';
let searchTerm = '';

/* ─── LANGUAGE COLORS (GitHub palette) ──────────────────────── */
const LANG_COLORS = {
  JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5',
  Java:'#b07219', Kotlin:'#A97BFF', Swift:'#F05138',
  'C#':'#178600', 'C++':'#f34b7d', C:'#555555', Go:'#00ADD8',
  Rust:'#dea584', Ruby:'#701516', PHP:'#4F5D95', HTML:'#e34c26',
  CSS:'#563d7c', Shell:'#89e051', Dart:'#00B4AB', Vue:'#41b883',
  Svelte:'#ff3e00', Dockerfile:'#384d54',
};
function langColor(l){ return LANG_COLORS[l] || '#6b7280'; }

/* ─── FETCH HELPERS ──────────────────────────────────────────── */
async function apiFetch(url, silent=false){
  try {
    const r = await fetch(url, { headers: HEADERS });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  } catch(e){
    if (!silent) throw e;
    return null;
  }
}

async function fetchRepos(){
  const data = await apiFetch(`${API}/orgs/${ORG}/repos?per_page=${PER_PAGE}&sort=updated&type=public`);
  return Array.isArray(data) ? data : [];
}

async function fetchReadme(repo){
  const data = await apiFetch(`${API}/repos/${ORG}/${repo}/readme`, true);
  if (!data?.content) return null;
  return atob(data.content.replace(/\n/g,''));
}

async function fetchReleases(repo){
  const data = await apiFetch(`${API}/repos/${ORG}/${repo}/releases?per_page=3`, true);
  return Array.isArray(data) ? data : [];
}

/* ─── RENDER ─────────────────────────────────────────────────── */
function renderCard(repo, readme, releases, idx){
  const lang     = repo.language || '';
  const color    = langColor(lang);
  const updated  = new Date(repo.updated_at).toLocaleDateString('es', {year:'numeric',month:'short',day:'numeric'});
  const readmeHTML = readme ? marked.parse(readme) : '';

  // Releases HTML
  let relHTML = '';
  if (releases.length === 0){
    relHTML = `<p class="no-release">Sin releases publicados</p>`;
  } else {
    relHTML = releases.map(rel => {
      const assetLinks = rel.assets
        .filter(a => !a.name.endsWith('.yml') && !a.name.endsWith('.yaml'))
        .slice(0,3)
        .map(a => {
          const icon = assetIcon(a.name);
          const size = formatBytes(a.size);
          return `<a class="dl-btn" href="${a.browser_download_url}" download title="${a.name} (${size})">
            ${icon} ${shortName(a.name)}
          </a>`;
        }).join('');

      const srcBtn = `<a class="dl-btn source" href="${rel.zipball_url}" download title="Código fuente .zip">
        📦 src.zip
      </a>`;

      return `<div class="release-item">
        <div>
          <div class="release-tag">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25zM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <strong>${rel.tag_name}</strong>
          </div>
          <div class="release-name" title="${rel.name || rel.tag_name}">${rel.name || rel.tag_name}</div>
        </div>
        <div class="release-assets">
          ${assetLinks || srcBtn}
          ${assetLinks ? srcBtn : ''}
        </div>
      </div>`;
    }).join('');
  }

  // README preview
  let readmeSection = '';
  if (readmeHTML){
    readmeSection = `
      <div class="readme-area">
        <div class="readme-collapsed" id="rc-${repo.id}">
          <div class="readme-content">${readmeHTML}</div>
        </div>
        <button class="read-more-btn" onclick="expandReadme(${repo.id},'${escStr(repo.name)}',this)">
          Leer más ↓
        </button>
      </div>`;
  } else {
    readmeSection = `<div class="readme-area"><p class="no-readme">// Sin README</p></div>`;
  }

  const card = document.createElement('article');
  card.className = 'card';
  card.style.animationDelay = `${idx * 60}ms`;
  card.dataset.name    = repo.name.toLowerCase();
  card.dataset.lang    = lang.toLowerCase();
  card.dataset.stars   = repo.stargazers_count;
  card.dataset.forks   = repo.forks_count;
  card.dataset.updated = repo.updated_at;
  card.role = 'listitem';

  card.innerHTML = `
    <div class="card-header">
      <h2 class="card-title">
        <a href="${repo.html_url}" target="_blank" rel="noopener">${repo.name}</a>
      </h2>
      ${lang ? `<div class="lang-badge">
        <span class="lang-dot" style="background:${color}"></span>
        ${lang}
      </div>` : ''}
    </div>

    ${readmeSection}

    <div class="releases-section">
      <p class="releases-title">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" style="display:inline;vertical-align:middle;margin-right:4px">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Releases
      </p>
      ${relHTML}
    </div>

    <div class="card-footer">
      <div class="meta-pills">
        <span class="meta-pill" title="Estrellas">
          ★ ${repo.stargazers_count}
        </span>
        <span class="meta-pill" title="Forks">
          ⑂ ${repo.forks_count}
        </span>
        <span class="meta-pill" title="Actualizado">${updated}</span>
      </div>
      <a class="gh-link" href="${repo.html_url}" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub ↗
      </a>
    </div>`;

  return card;
}

/* ─── UTILS ──────────────────────────────────────────────────── */
function escStr(s){ return s.replace(/'/g,"\\'"); }
function formatBytes(b){
  if(b<1024) return b+'B';
  if(b<1024*1024) return (b/1024).toFixed(0)+'KB';
  return (b/(1024*1024)).toFixed(1)+'MB';
}
function shortName(n){
  const ext = n.split('.').pop();
  const base = n.replace('.'+ext,'');
  return base.length > 10 ? base.slice(0,10)+'….'+ext : n;
}
function assetIcon(name){
  const n = name.toLowerCase();
  if(n.endsWith('.apk')) return '🤖';
  if(n.endsWith('.exe')||n.endsWith('.msi')) return '🪟';
  if(n.endsWith('.dmg')||n.endsWith('.pkg')) return '🍎';
  if(n.endsWith('.zip')||n.endsWith('.tar.gz')) return '📦';
  if(n.endsWith('.deb')||n.endsWith('.rpm')) return '🐧';
  if(n.endsWith('.jar')) return '☕';
  return '⬇';
}

/* ─── SKELETON LOADERS ───────────────────────────────────────── */
function showSkeletons(n=6){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'skeleton-card';
    g.appendChild(s);
  }
}

/* ─── FILTER & SORT ──────────────────────────────────────────── */
function applyFilters(){
  const term = searchTerm.toLowerCase();
  const grid = document.getElementById('grid');
  const cards = [...grid.querySelectorAll('.card')];
  let visible = 0;

  cards.forEach(c => {
    const nameMatch = c.dataset.name.includes(term);
    const langMatch = langFilter === 'all' || c.dataset.lang === langFilter.toLowerCase();
    const show = nameMatch && langMatch;
    c.style.display = show ? '' : 'none';
    if(show) visible++;
  });

  // Sort
  const sorted = cards.filter(c => c.style.display !== 'none');
  sorted.sort((a,b) => {
    if(sortMode==='stars')   return +b.dataset.stars - +a.dataset.stars;
    if(sortMode==='forks')   return +b.dataset.forks - +a.dataset.forks;
    if(sortMode==='name')    return a.dataset.name.localeCompare(b.dataset.name);
    return new Date(b.dataset.updated) - new Date(a.dataset.updated);
  });
  sorted.forEach(c => grid.appendChild(c));

  document.getElementById('empty').style.display = visible === 0 ? 'flex' : 'none';
}

/* ─── LANGUAGE FILTER BUTTONS ────────────────────────────────── */
function buildLangFilters(repos){
  const counts = {};
  repos.forEach(r => { if(r.language) counts[r.language] = (counts[r.language]||0)+1; });
  const fb = document.getElementById('filter-btns');
  Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,8)
    .forEach(([lang])=>{
      const btn = document.createElement('button');
      btn.className='filter-btn';
      btn.dataset.lang=lang;
      btn.innerHTML=`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${langColor(lang)};margin-right:5px"></span>${lang}`;
      fb.appendChild(btn);
    });
}

/* ─── README MODAL ───────────────────────────────────────────── */
window.expandReadme = function(id, name, btn){
  const collapsed = document.getElementById('rc-'+id);
  if(collapsed){
    // Expand inline
    collapsed.classList.remove('readme-collapsed');
    btn.style.display='none';
  }
};

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if(e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

/* ─── MAIN ───────────────────────────────────────────────────── */
async function main(){
  showSkeletons(6);
  const errBanner = document.getElementById('error-banner');

  let repos;
  try {
    repos = await fetchRepos();
  } catch(e){
    errBanner.style.display='block';
    errBanner.textContent = `⚠ No se pudieron cargar los repositorios: ${e.message}. Verifica que la organización sea pública o intenta más tarde.`;
    document.getElementById('grid').innerHTML='';
    return;
  }

  if(!repos.length){
    errBanner.style.display='block';
    errBanner.textContent='⚠ No se encontraron repositorios públicos en esta organización.';
    document.getElementById('grid').innerHTML='';
    return;
  }

  allRepos = repos;
  buildLangFilters(repos);

  // Fetch README + releases concurrently (limit parallelism)
  const BATCH = 6;
  const grid  = document.getElementById('grid');
  grid.innerHTML = '';

  // Add empty state div
  const emptyDiv = document.createElement('div');
  emptyDiv.id = 'empty';
  emptyDiv.innerHTML = `
    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M21 21l-4.35-4.35M11 6a5 5 0 1 1-10 0 5 5 0 0 1 10 0z"/>
    </svg>
    <p>No se encontraron repositorios con ese criterio.</p>`;
  grid.appendChild(emptyDiv);

  let totalReleases = 0;
  const langSet = new Set();

  for(let i=0;i<repos.length;i+=BATCH){
    const batch = repos.slice(i,i+BATCH);
    const results = await Promise.all(batch.map(async (repo,bi)=>{
      const [readme, releases] = await Promise.all([
        fetchReadme(repo.name),
        fetchReleases(repo.name)
      ]);
      return {repo, readme, releases, idx: i+bi};
    }));

    results.forEach(({repo,readme,releases,idx})=>{
      totalReleases += releases.length;
      if(repo.language) langSet.add(repo.language);
      const card = renderCard(repo, readme, releases, idx);
      grid.insertBefore(card, emptyDiv);
    });
  }

  // Update stats
  document.getElementById('stat-repos').textContent    = repos.length;
  document.getElementById('stat-releases').textContent = totalReleases;
  document.getElementById('stat-langs').textContent    = langSet.size;

  // Events
  document.getElementById('search').addEventListener('input', e=>{
    searchTerm = e.target.value;
    applyFilters();
  });

  document.getElementById('filter-btns').addEventListener('click', e=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    langFilter = btn.dataset.lang;
    applyFilters();
  });

  document.getElementById('sort-select').addEventListener('change', e=>{
    sortMode = e.target.value;
    applyFilters();
  });
}

main();
</script>
